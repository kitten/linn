[package]
name = "linn-eval"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
linn = { path = ".." }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
nlprule = { version = "=0.6.4", default-features = false, features = ["regex-fancy"] }

[dev-dependencies]
aho-corasick = "0.7"
bimap = { version = "0.6", features = ["serde"] }
bincode = "1.3"
either = { version = "1.6", features = ["serde"] }
fst = "0.4"
half = { version = "1.8", features = ["serde"] }
regex = "1.12.2"
srx = { version = "0.1.3", features = ["serde"] }
thiserror = "2"
unicase = "2.6"

fancy-regex = "0.5"

[[example]]
name = "pos_engine_parity"
test = true

[[example]]
name = "hybrid_compare"
test = true
