[package]
name = "linn-eval"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
linn = { path = ".." }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
nlprule = { version = "=0.6.4", default-features = false, features = ["regex-fancy"] }

[[example]]
name = "pos_engine_parity"
test = true

[[example]]
name = "hybrid_compare"
test = true
