[package]
name = "linn"
version = "0.1.1"
edition = "2024"
description = "Private local memory store"
license = "MIT"
publish = false

[dependencies]
tempfile = "3"
aho-corasick = "0.7"
bimap = { version = "0.6", features = ["serde"] }
bincode = "1.3"
derivative = "2.2"
either = { version = "1.6", features = ["serde"] }
enum_dispatch = "0.3"
fancy-regex = "0.5"
fst = "0.4"
half = { version = "1.8", features = ["serde"] }
itertools = "0.10"
lazy_static = "1.4"
log = "0.4"
once_cell = "1"
srx = { version = "0.1.3", features = ["serde"] }
unicase = "2.6"
clap = { version = "4.5", features = ["derive"] }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
regex = "1.12.2"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"
unicode-general-category = "1"
toml = "0.9"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "net"] }
safetensors = "0.5.3"
bytemuck = "1.24"
interprocess = { version = "=2.4.8", features = ["tokio"] }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }

[profile.release]
lto = "thin"
strip = "symbols"

[workspace]
members = ["evals"]
exclude = ["vendor/libsql"]
resolver = "3"

[patch.crates-io]
libsql = { path = "vendor/libsql" }

[target.'cfg(target_os = "macos")'.dependencies]
cblas = "0.5"

[target."cfg(unix)".dependencies]
daemonize-next = "=0.1.0"
libc = "0.2.191"

[dev-dependencies]

[build-dependencies]
sha2 = "0.10"
aho-corasick = "0.7"
bimap = { version = "0.6", features = ["serde"] }
bincode = "1.3"
derivative = "2.2"
either = { version = "1.6", features = ["serde"] }
enum_dispatch = "0.3"
fancy-regex = "0.5"
fst = "0.4"
half = { version = "1.8", features = ["serde"] }
itertools = "0.10"
lazy_static = "1.4"
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive", "rc"] }
srx = { version = "0.1.3", features = ["serde"] }
thiserror = "2"
unicase = "2.6"
